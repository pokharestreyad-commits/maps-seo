name: 🚀 Maps SEO - 100% Cloud Automated Publisher

on:
  schedule:
    # Runs Sunday, Tuesday, Thursday at 10:00 AM UTC
    - cron: '0 10 * * 0,2,4'
  workflow_dispatch: # Allows manual 1-click trigger directly from GitHub UI!

permissions:
  contents: write

jobs:
  publish-scheduled-posts:
    name: 🌐 Cloud Headless Publisher
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Project Dependencies
        run: npm install --production

      - name: 🤖 Execute Automated Post Publisher
        env:
          GOOGLE_SESSION_COOKIES: ${{ secrets.GOOGLE_SESSION_COOKIES }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: 'openai/gpt-oss-120b'
        run: node run-scheduler.js

      - name: 📸 Upload Execution Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: 💾 Commit & Push Updated Queue Status
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scheduled_posts.json || true
          git diff-index --quiet HEAD || git commit -m "chore: auto-update scheduled posts queue [skip ci]"
          git push || true
